<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnalytxIA | Historial</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Estilos para el Pop-up (Modal) del reporte */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px); }
        .modal-content { background-color: var(--card-bg); margin: 5% auto; padding: 2.5rem; border: 1px solid var(--border-color); width: 85%; max-width: 900px; border-radius: 12px; color: var(--text-main); max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
        .close { color: var(--text-muted); float: right; font-size: 28px; font-weight: bold; cursor: pointer; transition: color 0.2s; }
        .close:hover { color: var(--text-main); }
    </style>
</head>
<body>

    <!-- Barra de Navegación Premium -->
    <nav class="navbar">
        <div class="logo-text">AnalytxIA</div>
        <div>
            <a href="/" style="color: var(--text-muted); text-decoration: none; font-size: 0.95rem; font-weight: 500;">← Volver a Nueva Auditoría</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="header-title">🗄️ Historial de Auditorías</div>
            
            <div style="overflow-x: auto;">
                <table class="table-premium">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Cuenta ID</th>
                            <th>Resumen Rápido</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for row in auditorias %}
                        <tr>
                            <td style="white-space: nowrap; color: var(--text-muted);">{{ row.fecha }}</td>
                            <td style="color: var(--primary); font-weight: 500;">{{ row.account_id }}</td>
                            <td><span style="font-size: 0.85rem; color: var(--text-muted);">{{ row.reporte_corto }}</span></td>
                            <td>
                                <!-- Botón que abre el modal -->
                                <button class="btn-premium" style="padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="abrirModal('reporte-{{ row.id }}')">👁️ Ver Completo</button>
                                
                                <!-- Texto oculto para que lo lea el Javascript -->
                                <div id="reporte-{{ row.id }}" style="display: none;">{{ row.reporte_completo }}</div>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Estructura del Pop-up (Modal) -->
    <div id="reporteModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="cerrarModal()">&times;</span>
            <div class="header-title" style="margin-top: 0; color: var(--primary);">🧠 Reporte Completo de IA</div>
            <div id="modalText" class="ia-report-box" style="margin-top: 1rem; font-size: 0.95rem;"></div>
        </div>
    </div>

    <!-- Script para hacer funcionar el Pop-up -->
    <script>
        function abrirModal(id_elemento) {
            // Buscamos el texto oculto y lo metemos en el pop-up
            const textoCompleto = document.getElementById(id_elemento).innerText;
            document.getElementById('modalText').innerText = textoCompleto;
            // Mostramos el pop-up
            document.getElementById('reporteModal').style.display = 'block';
        }

        function cerrarModal() {
            document.getElementById('reporteModal').style.display = 'none';
        }

        // Si el usuario hace clic afuera del cuadro, se cierra
        window.onclick = function(event) {
            let modal = document.getElementById('reporteModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
